name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

jobs:
  macos:
    name: swift test (macOS, pure logic)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - run: swift --version
      - run: swift build
      - run: swift test

  ios-simulator:
    name: xcodebuild test (iOS simulator, UIKit suites)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme SegmentedPager-Package \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -skipPackagePluginValidation \
            > xcodebuild.log 2>&1
          status=$?
          grep -E "Test run with|Executed|error:|failed" xcodebuild.log | tail -20
          exit $status
