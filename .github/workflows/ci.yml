name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

jobs:
  macos:
    name: swift test (macOS, pure logic)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test

  ios-simulator:
    name: xcodebuild test (iOS simulator, UIKit suites)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Pick a simulator
        id: sim
        run: |
          xcodebuild -version
          udid=$(python3 .github/scripts/pick-simulator.py)
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid"
      - name: Test
        run: |
          set +e
          xcodebuild test \
            -scheme SegmentedPager-Package \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skipPackagePluginValidation \
            > xcodebuild.log 2>&1
          status=$?
          grep -E "Test run with|Suite .* (passed|failed)|error:|failed" xcodebuild.log | tail -30
          if [ $status -ne 0 ]; then tail -80 xcodebuild.log; fi
          exit $status
